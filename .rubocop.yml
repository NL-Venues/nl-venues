plugins: rubocop-rspec

AllCops:
  Exclude:
    - 'bin/*'
    - 'node_modules/**/*'
    - 'db/schema.rb'
    # Copied verbatim from the better_together engine by install:migrations; fixes belong upstream.
    - 'db/migrate/*.better_together.rb'
    - 'vendor/**/*'
  NewCops: enable
Style/StringLiterals:
  Exclude:
    - 'db/migrate/*'
