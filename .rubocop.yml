plugins: rubocop-rspec

AllCops:
  Exclude:
    - 'bin/*'
    - 'node_modules/**/*'
    - 'db/schema.rb'
    # Copied verbatim from the better_together engine by install:migrations; fixes belong upstream.
    - 'db/migrate/*.better_together.rb'
    - 'vendor/**/*'
  NewCops: enable
Style/StringLiterals:
  Exclude:
    - 'db/migrate/*'

# The spec helpers print diagnostics on purpose (pending migrations, sign-up form errors).
RSpec/Output:
  Exclude:
    - 'spec/rails_helper.rb'
    - 'spec/support/devise_session_helpers.rb'
